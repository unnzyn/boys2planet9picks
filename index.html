  const createRankingImage = async board => {
    const width = 1242, height = 1561;
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d');
    if (!context) throw new Error('無法建立圖片');
    const source = getComputedStyle(board).backgroundImage.match(/^url\(["']?(.*?)["']?\)$/)?.[1];
    if (!source) throw new Error('找不到成果框');
    const frame = new Image();
    frame.src = source;
    if (frame.decode) await frame.decode();
    else if (!frame.complete) await new Promise((resolve,reject) => { frame.onload = resolve; frame.onerror = reject; });
    context.drawImage(frame,0,0,width,height);
    // Match the frame's CSS treatment without changing the original portrait colors.
    const framePixels = context.getImageData(0,0,width,height);
    const rgba = framePixels.data;
    for (let index = 0; index < rgba.length; index += 4) {
      const gray = rgba[index] * .2126 + rgba[index + 1] * .7152 + rgba[index + 2] * .0722;
      const value = Math.max(0,Math.min(255,(gray * .8 - 128) * 5 + 128));
      rgba[index] = rgba[index + 1] = rgba[index + 2] = value;
    }
    context.putImageData(framePixels,0,0);
    // Cover the lettering baked into the source frame, then draw the new credit.
    context.fillStyle = '#000';
    context.fillRect(width * .45,height * .965,width * .1,height * .025);
    context.textAlign = 'center';
    context.textBaseline = 'bottom';
    context.font = '400 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
    context.fillStyle = '#fff';
    context.fillText('made by @k1rimi66',width / 2,height * .996);
    context.fillStyle = '#000';
    context.fillRect(width * .125,height * .128,width * .75,height * .84);
    const boardRect = board.getBoundingClientRect();
    const scaleX = width / boardRect.width, scaleY = height / boardRect.height;
    const cells = [...board.querySelectorAll('.ranking-cell')];
    await Promise.all(cells.map(async cell => {
      const image = cell.querySelector('img');
      if (image?.decode) await image.decode().catch(() => {});
    }));
    for (const cell of cells) {
      const rect = cell.getBoundingClientRect();
      const x = (rect.left - boardRect.left) * scaleX;
      const y = (rect.top - boardRect.top) * scaleY;
      const w = rect.width * scaleX, h = rect.height * scaleY;
      context.fillStyle = '#111';
      context.fillRect(x,y,w,h);
      const image = cell.querySelector('img');
      if (image?.naturalWidth && image?.naturalHeight) {
        const cover = Math.max(w / image.naturalWidth,h / image.naturalHeight);
        const sourceWidth = w / cover, sourceHeight = h / cover;
        const trimTop = image.hasAttribute('data-trim-top');
        const cropWidth = trimTop ? sourceWidth / 1.12 : sourceWidth;
        const cropHeight = trimTop ? sourceHeight / 1.12 : sourceHeight;
        const sourceX = (image.naturalWidth - cropWidth) / 2;
        const originalY = (image.naturalHeight - sourceHeight) * .24;
        const sourceY = Math.min(image.naturalHeight - cropHeight,originalY + (trimTop ? sourceHeight * .098 : 0));
        context.drawImage(image,sourceX,sourceY,cropWidth,cropHeight,x,y,w,h);
      } else {
        context.fillStyle = '#fff';
        context.textAlign = 'center';
        context.font = `400 ${Math.round(16 * scaleX)}px -apple-system, sans-serif`;
        context.fillText(cell.querySelector('.ranking-name')?.textContent || '',x + w / 2,y + h / 2);
      }
      const shade = context.createLinearGradient(0,y + h * .65,0,y + h);
      shade.addColorStop(0,'rgba(0,0,0,0)');
      shade.addColorStop(1,'rgba(0,0,0,.88)');
      context.fillStyle = shade;
      context.fillRect(x,y + h * .65,w,h * .35);
      const name = cell.querySelector('.ranking-name')?.textContent || '';
      const rank = cell.querySelector('.ranking-number')?.textContent || '';
      let size = Math.min(32,Math.max(19,Math.round(17 * scaleX)));
      context.textAlign = 'center';
      context.textBaseline = 'bottom';
      context.fillStyle = '#fff';
      context.shadowColor = '#000';
      context.shadowBlur = 7;
      context.font = `700 ${size}px -apple-system, "PingFang TC", sans-serif`;
      while (context.measureText(`${rank} ${name}`).width > w - 12 && size > 15) context.font = `700 ${--size}px -apple-system, "PingFang TC", sans-serif`;
      context.fillText(`${rank} ${name}`,x + w / 2,y + h - Math.max(7,8 * scaleY));
      context.shadowBlur = 0;
    }
    return new Promise((resolve,reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('無法輸出圖片')),'image/png'));
  };

  const preloadPeople = people => uniquePeople(people).forEach(person => {
    if (!person.photo || imageCache.has(person.id)) return;
    const img = new Image();
    img.src = person.photo;
    imageCache.set(person.id, img);
  });
  const pause = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  const preloadReady = async people => {};
  const revealPhotos = () => gameView.querySelectorAll('.pick-card').forEach(card => {
  card.classList.add('photo-ready');
});
  const timeNow = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const recordDecision = enteredAt => {
    if (!flowState) return;
    flowState.decisionTimes.push(timeNow() - enteredAt);
    flowState.decisionTimes = flowState.decisionTimes.slice(-3);
    flowState.fast = flowState.decisionTimes.length >= 3 && flowState.decisionTimes.reduce((a,b) => a + b, 0) / 3 < 800;
    gameView.classList[flowState.fast ? 'add' : 'remove']('is-fast');
  };
  const transitionContent = async (state, commit, nextPeople = [], confirmationMs = 0) => {
    const session = sessionId;
    await Promise.all([preloadReady(nextPeople),pause(confirmationMs)]);
    if (session !== sessionId || state !== gameState) return;
    gameView.classList.remove('is-choice-locked');
    commit();
  };
  const showInterstitial = (message, next, duration = 900) => {
    const session = sessionId;
    setUIState(UI.INTERSTITIAL);
    gameView.innerHTML = `<div class="milestone" aria-live="polite"><p>${message}</p></div>`;
    playUIFeedback('complete');
    setTimeout(() => {
      if (session === sessionId && uiState === UI.INTERSTITIAL) next();
    }, duration);
  };

  const cloneDecisionState = value => {
    if (Array.isArray(value)) return value.map(cloneDecisionState);
    if (value instanceof Set) return new Set(value);
    if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([key,item]) => [key,cloneDecisionState(item)]));
    return value;
  };
  const rememberDecision = () => decisionHistory.push({
    game:cloneDecisionState({...gameState,history:[],locked:false}),
    flow:cloneDecisionState(flowState)
  });
  const restorePreviousDecision = () => {
    if (!gameState) return;
    if (!gameState.locked && !decisionHistory.length) return;
    sessionId += 1; // Cancel a pending automatic advance before restoring the page.
    if (!gameState.locked) {
      const previous = decisionHistory.pop();
      gameState = previous.game;
      flowState = previous.flow;
    }
    gameState.locked = false;
    gameView.classList.remove('is-choice-locked');
    gameView.classList.toggle('is-fast',!!flowState.fast);
    waiting.classList.remove('result-screen');
    waiting.classList.toggle('pk-mode',gameState.type === 'tournament');
    document.body.classList.remove('is-result');
    progress.hidden = false;
    if (gameState.type === 'ninePick') renderNinePickGroup();
    else advanceTournament();
  };
  const restoreNinePickBack = restorePreviousDecision;

  const completeNinePickStage = () => gameState.onComplete({
    picks: uniquePeople(gameState.picks),
    eliminated: uniquePeople(gameState.eliminated)
  });

  const renderNinePickGroup = () => {
    if (gameState.groupIndex >= gameState.groups.length) {
      completeNinePickStage();
      return;
    }
    const group = gameState.groups[gameState.groupIndex];
    gameState.locked = false;
    if (group.length === 1) {
      gameState.picks.push(group[0]);
      gameState.groupIndex += 1;
      renderNinePickGroup();
      return;
    }
    const state = gameState;
    const required = state.selectionQuota ? state.selectionQuota(group.length) : selectionQuota(group.length);
    const renderToken = state.renderToken = (state.renderToken || 0) + 1;
    setUIState(UI.GRID_ENTERING);
    state.enteredAt = timeNow();
    const selected = new Set();
    const groupNumber = gameState.groupIndex + 1;
    stageLabel.textContent = `${state.stageLabel} · ${groupNumber} / ${state.groups.length}`;
    stageProgress(Math.min(.98, (groupNumber - 1) / gameState.groups.length));
    preloadPeople(gameState.groups[gameState.groupIndex + 1] || []);
    gameView.innerHTML = `
      <div class="game-head">
        <h2 class="game-title">選擇 ${required} 位</h2>
         <div class="game-head-meta"><span class="glass-dots" id="pickStatus" aria-label="已選 0 / ${required}">${Array.from({length:required}, () => '<i class="glass-dot"></i>').join('')}</span></div>
      </div>
       <div class="pick-grid nine-grid ${group.length > 9 ? 'large-grid' : ''}">${group.map(personCard).join('')}</div>
      <div class="game-actions">
        <button class="back" type="button" data-action="back" ${decisionHistory.length ? '' : 'disabled'}>上一頁</button>
      </div>`;
    const status = gameView.querySelector('#pickStatus');
    const syncSelection = () => {
      status.setAttribute('aria-label', `已選 ${selected.size} / ${required}`);
      status.querySelectorAll('.glass-dot').forEach((dot, index) => dot.classList.toggle('filled', index < selected.size));
    };
    const cards = [...gameView.querySelectorAll('.pick-card')];
    cards.forEach(card => {
      card.addEventListener('pointerdown', () => {
        if (uiState === UI.GRID_SELECTING) card.classList.add('is-pressed');
      });
      ['pointerup','pointercancel','pointerleave'].forEach(type => card.addEventListener(type, () => card.classList.remove('is-pressed')));
      card.addEventListener('click', () => {
      if (state !== gameState || state.locked || state.renderToken !== renderToken || uiState !== UI.GRID_SELECTING) return;
      const id = Number(card.dataset.id);
      if (selected.has(id)) {
        selected.delete(id);
        card.classList.remove('selected');
      } else if (selected.size < required) {
        selected.add(id);
        card.classList.add('selected');
      }
      lightHaptic();
      playUIFeedback('select');
      syncSelection();
      if (selected.size === required) {
        state.locked = true;
        setUIState(UI.GRID_CONFIRMING);
        recordDecision(state.enteredAt);
        status.classList.add('complete');
        gameView.classList.add('is-choice-locked');
        cards.forEach(other => other.classList.add(selected.has(Number(other.dataset.id)) ? 'is-preferred' : 'is-muted'));
        const picked = group.filter(person => selected.has(person.id));
        void transitionContent(state, () => {
          rememberDecision();
          state.picks.push(...picked);
          state.eliminated.push(...group.filter(person => !selected.has(person.id)));
          state.groupIndex += 1;
          renderNinePickGroup();
        },state.groups[state.groupIndex + 1] || [],380);
      }
      });
    });
    revealPhotos();
    setUIState(UI.GRID_SELECTING);
    gameView.querySelector('[data-action="back"]').addEventListener('click', () => {
      if (state === gameState && state.renderToken === renderToken && [UI.GRID_SELECTING,UI.GRID_CONFIRMING].includes(uiState)) restoreNinePickBack();
    });
  };

  const startNinePickStage = options => {
    const people = uniquePeople(options.source);
    flowState.currentPool = people;
    waiting.classList.remove('pk-mode');
    gameState = {
      type:'ninePick',round:flowState.round,
       groups:balancedGroups(people,options.groupCount),groupIndex:0,picks:[],eliminated:[],
       history:[],locked:false,stageLabel:options.stageLabel,progressStart:options.progressStart,
      progressEnd:options.progressEnd,onComplete:options.onComplete,selectionQuota:options.selectionQuota
    };
    preloadPeople(gameState.groups[0] || []);
    renderNinePickGroup();
  };

  // Persistent Tournament Top-K. Nodes use indices so parent/path data stays serializable.
  const tournamentPairKey = (a, b) => JSON.stringify([a.id, b.id].sort((x,y) => String(x).localeCompare(String(y))));
  const createTournament = (people, k = 9) => {
    let size = 1;
    while (size < people.length) size *= 2;
    const tree = Array.from({length:size * 2}, (_, id) => ({
      id,parent:id > 1 ? Math.floor(id / 2) : null,
      left:id < size ? id * 2 : null,right:id < size ? id * 2 + 1 : null,
      winner:null,loser:null,resolved:id >= size,revision:0
    }));
    const leafById = {};
    people.forEach((person,index) => {
      const leaf = size + index;
      tree[leaf].winner = person;
      leafById[person.id] = leaf;
    });
    for (let id = size; id < size * 2; id += 1) {
      const path = [];
      for (let parent = tree[id].parent; parent !== null; parent = tree[parent].parent) path.push(parent);
      tree[id].path = path;
    }
    return {
      type:'tournament',people,tree,leafById,root:1,k:Math.min(k,people.length),
      pending:Array.from({length:size - 1},(_,i) => size - 1 - i),pendingIndex:0,
      currentPair:null,currentNode:null,comparisonCache:{},comparisonHistory:[],
      extractionHistory:[],topK:[],comparisons:0,cacheHits:0,byes:0,done:false,locked:false
    };
  };
  const resolveTournamentNode = (state,id,winner,source) => {
    const node = state.tree[id];
    const left = state.tree[node.left].winner;
    const right = state.tree[node.right].winner;
    node.winner = winner;
    node.loser = left && right ? (winner.id === left.id ? right : left) : null;
    node.resolved = true;
    node.revision += 1;
    state.comparisonHistory.push({node:id,left:left?.id ?? null,right:right?.id ?? null,
      winner:winner?.id ?? null,loser:node.loser?.id ?? null,source,rank:state.topK.length + 1});
    if (source === 'cache') state.cacheHits += 1;
    if (source === 'bye') state.byes += 1;
    state.pendingIndex += 1;
  };
  const answerTournament = (state,selectedId) => {
    if (state.done || !state.currentPair) return false;
    const winner = state.currentPair.find(person => person.id === selectedId);
    if (!winner) return false;
    state.comparisonCache[tournamentPairKey(...state.currentPair)] = winner.id;
    state.comparisons += 1;
    resolveTournamentNode(state,state.currentNode,winner,'choice');
    state.currentPair = null;
    state.currentNode = null;
    return true;
  };
  // Only the initial queue covers the whole tree. Every later queue is one leaf's path.
  const stepTournament = state => {
    if (state.done) return null;
    if (state.currentPair) return state.currentPair;
    while (true) {
      if (state.pendingIndex < state.pending.length) {
        const id = state.pending[state.pendingIndex];
        const node = state.tree[id];
        const left = state.tree[node.left].winner;
        const right = state.tree[node.right].winner;
        if (!left || !right) {
          resolveTournamentNode(state,id,left || right,'bye');
          continue;
        }
        const key = tournamentPairKey(left,right);
        if (Object.prototype.hasOwnProperty.call(state.comparisonCache,key)) {
          const winnerId = state.comparisonCache[key];
          resolveTournamentNode(state,id,left.id === winnerId ? left : right,'cache');
          continue;
        }
        state.currentNode = id;
        state.currentPair = [left,right];
        return state.currentPair;
      }
      const winner = state.tree[state.root].winner;
      if (!winner || state.topK.length >= state.k) { state.done = true; return null; }
      state.topK.push(winner);
      const leaf = state.leafById[winner.id];
      state.tree[leaf].winner = null;
      state.tree[leaf].revision += 1;
      const path = state.tree[leaf].path.slice();
      const stopped = state.topK.length === state.k;
      state.extractionHistory.push({rank:state.topK.length,winner:winner.id,leaf,path,
        replay:stopped ? [] : path.slice(),historyOffset:state.comparisonHistory.length});
      // The cached root is a historical result after the final extraction; no #10 work.
      if (stopped) { state.done = true; state.pending = []; state.pendingIndex = 0; return null; }
      for (const id of path) state.tree[id].resolved = false;
      state.pending = path;
      state.pendingIndex = 0;
    }
  };

  const advanceTournament = () => {
    if (!gameState || gameState.type !== 'tournament') return;
    const state = gameState;
    const pair = stepTournament(state);
    if (pair) { preloadPeople(pair); renderTournamentMatch(); return; }
    flowState.finalists = state.topK.slice();
    renderFinalRanking(flowState.finalists);
  };
  const chooseTournament = selectedId => {
    const state = gameState;
    if (!state || state.type !== 'tournament' || state.locked || uiState !== UI.PK_SELECTING ||
        !state.currentPair?.some(person => person.id === selectedId)) return;
    state.locked = true;
    setUIState(UI.PK_CONFIRMING);
    recordDecision(state.enteredAt);
    lightHaptic();
    playUIFeedback('select');
    gameView.classList.add('is-choice-locked');
    gameView.querySelectorAll('.pick-card').forEach(card => {
      card.disabled = true;
      card.classList.add(Number(card.dataset.id) === selectedId ? 'is-preferred' : 'is-muted');
    });
    void transitionContent(state, () => {
      rememberDecision();
      answerTournament(state,selectedId);
      advanceTournament();
    },[],300);
  };
  const renderTournamentMatch = () => {
    const state = gameState;
    state.locked = false;
    const renderToken = state.renderToken = (state.renderToken || 0) + 1;
    setUIState(UI.PK_ENTERING);
    state.enteredAt = timeNow();
    stageLabel.textContent = '最終選擇';
    stageProgress(state.topK.length / Math.max(1,state.k));
    gameView.innerHTML = `
      <div class="game-head"><h2 class="game-title">更喜歡哪一位？</h2></div>
      <div class="pick-grid pk-grid">${state.currentPair.map(personCard).join('')}</div>
      <div class="game-actions">
        <button class="back" type="button" data-action="back" ${decisionHistory.length ? '' : 'disabled'}>上一頁</button>
      </div>`;
    gameView.querySelector('[data-action="back"]').addEventListener('click', () => {
      if (state === gameState && state.renderToken === renderToken && [UI.PK_SELECTING,UI.PK_CONFIRMING].includes(uiState)) restorePreviousDecision();
    });
    gameView.querySelectorAll('.pick-card').forEach(card => {
      card.addEventListener('pointerdown', () => { if (uiState === UI.PK_SELECTING) card.classList.add('is-pressed'); });
      ['pointerup','pointercancel','pointerleave'].forEach(type => card.addEventListener(type, () => card.classList.remove('is-pressed')));
      card.addEventListener('click', event => {
        if (state !== gameState || state.renderToken !== renderToken || event.detail > 1) return;
        chooseTournament(Number(card.dataset.id));
      });
    });
    revealPhotos();
    setUIState(UI.PK_SELECTING);
  };
  const startTournamentStage = source => {
    const people = shuffle(uniquePeople(source)); // Exactly one shuffle of the final pool.
    flowState.finalCandidatePool = people;
    preloadPeople(people);
    waiting.classList.add('pk-mode');
    gameState = Object.assign(createTournament(people),{
      round:flowState.round,progressStart:65,progressEnd:100
    });
    advanceTournament();
  };

  const startFlow = round => {
    decisionHistory = [];
    waiting.classList.remove('result-screen');
    document.body.classList.remove('is-result');
    const pool = uniquePeople(contestantGroups[round]);
    if (!pool.length) {
      renderEmptyState(round);
      return;
    }
    flowState = {
      round,currentPool:pool,winners:[],mainWinners:[],challengePool:[],mainSelectedIds:new Set(),
      challengeWinners:[],finalCandidatePool:[],finalists:[],
      decisionTimes:[],fast:false
    };
    const beginTournament = people => startTournamentStage(uniquePeople([...flowState.mainWinners,...people]));
    if (pool.length <= 9) {
      beginTournament(pool);
      return;
    }
    startNinePickStage({
      source:pool,stageLabel:'初選',progressStart:0,progressEnd:35,
      onComplete:({picks,eliminated}) => {
        flowState.mainWinners = uniquePeople(picks);
        flowState.winners = flowState.mainWinners;
        flowState.mainSelectedIds = new Set(flowState.mainWinners.map(person => person.id));
        flowState.challengePool = uniquePeople(eliminated);
        if (!flowState.challengePool.length) {
          beginTournament([]);
          return;
        }
        // Only contestants who were not chosen in the first round enter this single second-chance round.
        startNinePickStage({
           source:flowState.challengePool,stageLabel:'再次選擇',groupCount:2,selectionQuota:count => Math.min(1,count),
          progressStart:35,progressEnd:65,
          onComplete:({picks:secondChancePicks}) => {
            flowState.challengeWinners = uniquePeople(secondChancePicks);
            beginTournament(flowState.challengeWinners);
          }
        });
      }
    });
  };

  const startGame = () => {
    if (!waiting.hidden || setup.hidden) return;
    sessionId += 1;
    setUIState(UI.INTRO);
    document.body.classList.add('is-playing');
    document.body.classList.remove('is-result');
    const round = 'first';
    setup.hidden = true;
    waiting.hidden = false;
    progress.hidden = false;
    startFlow(round);
    scrollTop();
  };

  window.boys2planetContestants = contestants;
  window.boys2planetGroups = contestantGroups;
  window.startBoysPlanetGame = () => {
    try { startGame(); }
    catch (error) { showError(error); }
  };
  document.querySelectorAll('input[name="round"]').forEach(input => input.addEventListener('change', syncRoundChoices));
  syncRoundChoices();
  if (restartGameBtn) restartGameBtn.addEventListener('click', () => {
    showSetup();
  });
  startBtn.addEventListener('click', event => {
    event.preventDefault();
    if (setup.hidden) return;
    window.startBoysPlanetGame();
  });
  let swipeStartY = null;
  startBtn.addEventListener('touchstart', event => {
    swipeStartY = event.touches[0]?.clientY ?? null;
  }, {passive:true});
  startBtn.addEventListener('touchend', event => {
    if (swipeStartY === null || setup.hidden) return;
    const distance = swipeStartY - (event.changedTouches[0]?.clientY ?? swipeStartY);
    swipeStartY = null;
    if (distance < 40) return;
    event.preventDefault();
    window.startBoysPlanetGame();
  }, {passive:false});
  window.requestAnimationFrame(() => window.startBoysPlanetGame());
})();
</script>
</body>
</html>
